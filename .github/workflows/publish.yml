name: Publish Node.js Package

on:
  workflow_dispatch:
  push:
    tags: 
      - v[1-9]+.[0-9]+.[0-9]+


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - name: Find and Replace  
        uses: jacobtomlinson/gha-find-replace@3.0.5
        with:
          find: '"name": "hexo-search-engine-submit"'
          replace: '"name": "@akia818/hexo-search-engine-submit"'
          include: "package.json"
          regex: true
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm, publish-gpr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const body = changelog.split(`## ${tag}\n`)[1]?.split('\n## ')[0].trim();
          if (tag !== `v${version}` || !body) {
            throw new Error('Release tag, package version, and changelog must match');
          }
          (async () => {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28'
              },
              body: JSON.stringify({ tag_name: tag, name: tag, body })
            });
            if (!response.ok) {
              throw new Error(`GitHub release failed (${response.status}): ${await response.text()}`);
            }
            console.log((await response.json()).html_url);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
